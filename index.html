<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 - 2D SVG 动画</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1e29;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .canvas-card {
      position: relative;
      width: 95vw;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, #6ec6ff 0%, #bfe3f7 58%, #88c988 59%, #5e9d5e 64%, #474749 65%, #2d2d30 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1);
      transition: background 0.8s ease;
    }

    /* 日落与夜间主题类 */
    .canvas-card.sunset {
      background: linear-gradient(180deg, #e65c40 0%, #ff9e56 45%, #ffd166 58%, #567d58 59%, #3a5c3c 64%, #3a383a 65%, #222022 100%);
    }
    .canvas-card.night {
      background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 50%, #415a77 58%, #2b3a2c 59%, #1e281e 64%, #1e1e24 65%, #111116 100%);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 控制面板 */
    .controls-panel {
      margin-top: 18px;
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .btn {
      background: #ff7b25;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 123, 37, 0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 123, 37, 0.5);
      background: #ff8c42;
    }
    .btn:active {
      transform: translateY(1px);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }
    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #ddd;
    }

    .speed-control input[type="range"] {
      width: 110px;
      accent-color: #ff7b25;
      cursor: pointer;
    }

    .status-tag {
      position: absolute;
      top: 16px;
      left: 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #4cd964;
      border-radius: 50%;
      box-shadow: 0 0 8px #4cd964;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* 动画关键帧定义 */
    @keyframes floatCloudFar {
      from { transform: translateX(0); }
      to { transform: translateX(-1200px); }
    }
    @keyframes floatCloudNear {
      from { transform: translateX(0); }
      to { transform: translateX(-1400px); }
    }
    @keyframes parallaxHills {
      from { transform: translateX(0); }
      to { transform: translateX(-1000px); }
    }
    @keyframes roadMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -200; }
    }
    @keyframes wheelRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes crankRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bodyBobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-1.5deg); }
    }
    @keyframes beakJiggle {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      30% { transform: scale(1.03, 0.98) rotate(1deg); }
      70% { transform: scale(0.98, 1.02) rotate(-0.8deg); }
    }
    @keyframes scarfFlutter {
      0%, 100% { transform: rotate(0deg) skewY(0deg); }
      25% { transform: rotate(-5deg) skewY(3deg); }
      75% { transform: rotate(7deg) skewY(-3deg); }
    }
    @keyframes fishBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(8deg); }
    }
    @keyframes tailWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    @keyframes bellRing {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-15deg); }
      40% { transform: rotate(15deg); }
      60% { transform: rotate(-10deg); }
      80% { transform: rotate(10deg); }
    }

    /* 动画类绑缚与速度变速支持 */
    .anim-cloud-far { animation: floatCloudFar 45s linear infinite; }
    .anim-cloud-near { animation: floatCloudNear 26s linear infinite; }
    .anim-hills { animation: parallaxHills 14s linear infinite; }
    .anim-road { animation: roadMove 1.2s linear infinite; }
    .anim-wheel-r { transform-origin: 350px 425px; animation: wheelRotate 1.2s linear infinite; }
    .anim-wheel-f { transform-origin: 670px 425px; animation: wheelRotate 1.2s linear infinite; }
    .anim-crank { transform-origin: 490px 425px; animation: crankRotate 1.2s linear infinite; }
    .anim-body { animation: bodyBobbing 0.6s ease-in-out infinite; transform-origin: 470px 340px; }
    .anim-beak { animation: beakJiggle 0.6s ease-in-out infinite; transform-origin: 540px 175px; }
    .anim-scarf { animation: scarfFlutter 0.35s ease-in-out infinite; transform-origin: 485px 230px; }
    .anim-fish { animation: fishBounce 0.6s cubic-bezier(0.3, 1.4, 0.6, 1) infinite; transform-origin: 720px 290px; }
    .anim-tail { animation: tailWiggle 0.6s ease-in-out infinite; transform-origin: 380px 290px; }
    .anim-eye { animation: blink 4s infinite; transform-origin: 550px 170px; }

    .is-ringing {
      animation: bellRing 0.4s ease-in-out;
      transform-origin: 625px 248px;
    }

    /* 暂停状态 */
    .paused * {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body>

  <!-- 画布容器 -->
  <div class="canvas-card" id="sceneCard">
    <div class="status-tag">
      <div class="pulse-dot"></div>
      <span id="speedDisplay">骑行巡航速度: 正常 (1.0x)</span>
    </div>

    <svg id="pelicanSvg" viewBox="0 0 1000 562.5" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 滤镜与渐变 -->
        <linearGradient id="skySun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff6cc" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="70%" stop-color="#f2f5f8"/>
          <stop offset="100%" stop-color="#d4dee5"/>
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#ffa62b"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#d95a00"/>
        </linearGradient>

        <linearGradient id="beakTopGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff9f1c"/>
          <stop offset="85%" stop-color="#f77f00"/>
          <stop offset="100%" stop-color="#d62828"/>
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2ec4b6"/>
          <stop offset="100%" stop-color="#0f7173"/>
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9"/>
          <stop offset="40%" stop-color="#ffdd53" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
        </radialGradient>

        <!-- 车轮阴影 -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="6" stdDeviation="4" flood-opacity="0.25"/>
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- 太阳/月亮 -->
      <g id="celestialBody" transform="translate(850, 100)">
        <circle cx="0" cy="0" r="70" fill="url(#sunGlow)"/>
        <circle cx="0" cy="0" r="38" fill="#fff7d6"/>
      </g>

      <!-- 远景：云层 1 (慢速) -->
      <g class="anim-cloud-far" fill="#ffffff" opacity="0.65">
        <g transform="translate(100, 70) scale(0.9)">
          <ellipse cx="60" cy="40" rx="60" ry="25"/>
          <ellipse cx="110" cy="30" rx="40" ry="28"/>
          <ellipse cx="30" cy="42" rx="35" ry="18"/>
        </g>
        <g transform="translate(600, 90) scale(0.7)">
          <ellipse cx="60" cy="40" rx="60" ry="25"/>
          <ellipse cx="110" cy="30" rx="40" ry="28"/>
          <ellipse cx="30" cy="42" rx="35" ry="18"/>
        </g>
        <g transform="translate(1150, 60) scale(1)">
          <ellipse cx="60" cy="40" rx="60" ry="25"/>
          <ellipse cx="110" cy="30" rx="40" ry="28"/>
          <ellipse cx="30" cy="42" rx="35" ry="18"/>
        </g>
        <g transform="translate(1700, 85) scale(0.8)">
          <ellipse cx="60" cy="40" rx="60" ry="25"/>
          <ellipse cx="110" cy="30" rx="40" ry="28"/>
          <ellipse cx="30" cy="42" rx="35" ry="18"/>
        </g>
      </g>

      <!-- 远山轮廓 (视差滚动) -->
      <g class="anim-hills">
        <!-- 连绵山脉 x 2 组无缝拼接 -->
        <path d="M 0 335 Q 120 280 250 335 T 500 335 T 750 335 T 1000 335 T 1250 335 T 1500 335 T 1750 335 T 2000 335 L 2000 360 L 0 360 Z"
              fill="#52996d" opacity="0.6"/>
        <path d="M 0 340 Q 90 305 180 340 T 360 340 T 540 340 T 720 340 T 900 340 T 1080 340 T 1260 340 T 1440 340 T 1620 340 T 1800 340 T 2000 340 L 2000 360 L 0 360 Z"
              fill="#43845b" opacity="0.9"/>
      </g>

      <!-- 近景：快速飘动的白云 -->
      <g class="anim-cloud-near" fill="#ffffff" opacity="0.85">
        <g transform="translate(300, 130) scale(1.1)">
          <ellipse cx="50" cy="35" rx="50" ry="20"/>
          <ellipse cx="85" cy="25" rx="30" ry="22"/>
        </g>
        <g transform="translate(950, 110) scale(1.2)">
          <ellipse cx="50" cy="35" rx="55" ry="22"/>
          <ellipse cx="90" cy="22" rx="32" ry="24"/>
        </g>
        <g transform="translate(1600, 140) scale(1)">
          <ellipse cx="50" cy="35" rx="50" ry="20"/>
          <ellipse cx="85" cy="25" rx="30" ry="22"/>
        </g>
      </g>

      <!-- 地面与公路背景 -->
      <g id="roadGround">
        <!-- 远草坪/路肩 -->
        <rect x="0" y="330" width="1000" height="35" fill="#4ea65b"/>
        <!-- 灌木丛装饰 -->
        <g fill="#377f44" opacity="0.8">
          <circle cx="80" cy="340" r="14"/>
          <circle cx="95" cy="336" r="18"/>
          <circle cx="115" cy="342" r="12"/>
          <circle cx="430" cy="338" r="16"/>
          <circle cx="450" cy="335" r="20"/>
          <circle cx="820" cy="340" r="15"/>
          <circle cx="840" cy="336" r="17"/>
        </g>
        <!-- 沥青主马路 -->
        <rect x="0" y="365" width="1000" height="198" fill="#3b3b40"/>
        <!-- 马路顶部水泥边道 -->
        <rect x="0" y="365" width="1000" height="7" fill="#8d99ae"/>
        <line x1="0" y1="372" x2="1000" y2="372" stroke="#2b2b30" stroke-width="2"/>
        <!-- 快速移动的马路白色虚线 -->
        <line class="anim-road" x1="-100" y1="465" x2="1100" y2="465"
              stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="45 55"/>
      </g>

      <!-- 自行车与鹈鹕的投影 -->
      <g opacity="0.32">
        <ellipse cx="505" cy="495" rx="215" ry="18" fill="#18181c"/>
      </g>

      <!-- ==============================
           主实体群组（包含车与鹈鹕）
      ============================== -->
      <g id="cyclistAndBike">

        <!-- 后腿（在车架后侧：左腿） -->
        <g id="leftLegGroup">
          <!-- 大腿 -->
          <line id="leftThigh" x1="455" y1="315" x2="440" y2="385" stroke="#f28e2b" stroke-width="12" stroke-linecap="round"/>
          <!-- 小腿 -->
          <line id="leftCalf" x1="440" y1="385" x2="460" y2="455" stroke="#e87a1e" stroke-width="10" stroke-linecap="round"/>
          <!-- 蹼足 -->
          <polygon id="leftFoot" points="445,462 485,462 470,450" fill="#d96b14"/>
        </g>

        <!-- 自行车后轮 (圆心 350, 425) -->
        <g id="rearWheel">
          <circle cx="350" cy="425" r="70" fill="none" stroke="#222226" stroke-width="14"/>
          <circle cx="350" cy="425" r="64" fill="rgba(255,255,255,0.08)" stroke="#d8d8d8" stroke-width="3"/>
          <!-- 辐条组 (带旋转动画) -->
          <g class="anim-wheel-r" stroke="#b0b0b0" stroke-width="1.8">
            <line x1="350" y1="361" x2="350" y2="489"/>
            <line x1="286" y1="425" x2="414" y2="425"/>
            <line x1="305" y1="380" x2="395" y2="470"/>
            <line x1="395" y1="380" x2="305" y2="470"/>
            <line x1="326" y1="368" x2="374" y2="482"/>
            <line x1="374" y1="368" x2="326" y2="482"/>
            <line x1="293" y1="401" x2="407" y2="449"/>
            <line x1="293" y1="449" x2="407" y2="401"/>
          </g>
          <!-- 轮毂与反光片 -->
          <circle cx="350" cy="425" r="10" fill="#555"/>
          <circle cx="350" cy="425" r="5" fill="#e0e0e0"/>
          <rect x="345" y="380" width="10" height="18" rx="3" fill="#ffb703" opacity="0.9"/>
        </g>

        <!-- 自行车前轮 (圆心 670, 425) -->
        <g id="frontWheel">
          <circle cx="670" cy="425" r="70" fill="none" stroke="#222226" stroke-width="14"/>
          <circle cx="670" cy="425" r="64" fill="rgba(255,255,255,0.08)" stroke="#d8d8d8" stroke-width="3"/>
          <!-- 辐条组 (带旋转动画) -->
          <g class="anim-wheel-f" stroke="#b0b0b0" stroke-width="1.8">
            <line x1="670" y1="361" x2="670" y2="489"/>
            <line x1="606" y1="425" x2="734" y2="425"/>
            <line x1="625" y1="380" x2="715" y2="470"/>
            <line x1="715" y1="380" x2="625" y2="470"/>
            <line x1="646" y1="368" x2="694" y2="482"/>
            <line x1="694" y1="368" x2="646" y2="482"/>
            <line x1="613" y1="401" x2="727" y2="449"/>
            <line x1="613" y1="449" x2="727" y2="401"/>
          </g>
          <circle cx="670" cy="425" r="10" fill="#555"/>
          <circle cx="670" cy="425" r="5" fill="#e0e0e0"/>
          <rect x="665" y="380" width="10" height="18" rx="3" fill="#ffb703" opacity="0.9"/>
        </g>

        <!-- 车架组 (复古绿涂装) -->
        <g id="bikeFrame" stroke="url(#frameGrad)" stroke-linecap="round" stroke-linejoin="round">
          <!-- 后平叉 (350,425) -> 中轴(490,425) -->
          <line x1="350" y1="425" x2="490" y2="425" stroke-width="9"/>
          <!-- 后上叉 (350,425) -> 座管夹(440,320) -->
          <line x1="350" y1="425" x2="440" y2="320" stroke-width="8"/>
          <!-- 立管 (490,425) -> 座管夹(440,320) -->
          <line x1="490" y1="425" x2="440" y2="320" stroke-width="12"/>
          <!-- 下管 (490,425) -> 头管(620,295) -->
          <line x1="490" y1="425" x2="620" y2="295" stroke-width="13"/>
          <!-- 上管 (440,320) -> 头管(620,295) -->
          <line x1="440" y1="320" x2="620" y2="295" stroke-width="10"/>
          <!-- 前叉 (620,295) -> 前轴(670,425) -->
          <line x1="620" y1="295" x2="670" y2="425" stroke-width="9"/>
          <!-- 车把立管 (620,295) -> 把横(615,250) -->
          <line x1="620" y1="295" x2="615" y2="250" stroke="#777" stroke-width="7"/>
          <!-- 弯把手柄 -->
          <path d="M 615 250 Q 640 245 645 265" fill="none" stroke="#222" stroke-width="6"/>
          <!-- 挡泥板 (后) -->
          <path d="M 305 410 A 70 70 0 0 1 405 375" fill="none" stroke="#1b635b" stroke-width="5"/>
          <!-- 挡泥板 (前) -->
          <path d="M 640 375 A 70 70 0 0 1 720 430" fill="none" stroke="#1b635b" stroke-width="5"/>
        </g>

        <!-- 车座 / 鞍座 -->
        <g id="saddle">
          <line x1="440" y1="320" x2="445" y2="298" stroke="#888" stroke-width="8" stroke-linecap="round"/>
          <path d="M 405 296 C 425 292, 465 292, 475 298 C 470 306, 445 304, 405 296 Z" fill="#59321c"/>
          <ellipse cx="420" cy="302" rx="4" ry="5" fill="#3b1f10"/>
        </g>

        <!-- 车前置物篮与蹦跳的小鱼 -->
        <g id="basketGroup">
          <rect x="635" y="258" width="45" height="34" rx="4" fill="#d4a373" stroke="#8c6239" stroke-width="2"/>
          <line x1="635" y1="269" x2="680" y2="269" stroke="#8c6239" stroke-width="1.5"/>
          <line x1="635" y1="280" x2="680" y2="280" stroke="#8c6239" stroke-width="1.5"/>
          <line x1="650" y1="258" x2="650" y2="292" stroke="#8c6239" stroke-width="1.5"/>
          <line x1="665" y1="258" x2="665" y2="292" stroke="#8c6239" stroke-width="1.5"/>

          <!-- 篮子里的活泼小鱼 (动画晃动) -->
          <g class="anim-fish">
            <!-- 鱼身 -->
            <path d="M 645 260 C 655 240, 675 245, 675 262 C 665 272, 645 270, 645 260 Z" fill="#4ea8de"/>
            <!-- 鱼尾 -->
            <polygon points="675,260 690,250 686,268" fill="#48cae4"/>
            <!-- 鱼眼 -->
            <circle cx="653" cy="254" r="2.5" fill="#fff"/>
            <circle cx="652" cy="254" r="1.2" fill="#000"/>
            <!-- 鱼鳃纹理 -->
            <path d="M 658 253 Q 662 258 658 263" fill="none" stroke="#0077b6" stroke-width="1"/>
          </g>
        </g>

        <!-- 车铃铛 (可点击互动摇晃) -->
        <g id="bikeBell" onclick="ringBell()" style="cursor: pointer;">
          <circle cx="625" cy="245" r="7" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
          <rect x="622" y="250" width="6" height="4" fill="#333"/>
          <circle cx="625" cy="243" r="2.5" fill="#ffe3a8"/>
        </g>

        <!-- 车前大灯 (带复古光晕) -->
        <g id="headLight">
          <polygon points="655,282 850,250 850,330" fill="url(#skySun)" opacity="0.3" pointer-events="none"/>
          <path d="M 645 285 A 8 8 0 0 1 656 278 L 656 292 A 8 8 0 0 1 645 285 Z" fill="#ffdd53"/>
          <rect x="640" y="280" width="6" height="10" rx="2" fill="#333"/>
        </g>

        <!-- 中轴大齿盘与牙盘 (圆心 490, 425) -->
        <g id="chainRing">
          <circle cx="490" cy="425" r="24" fill="#2b2d42" stroke="#8d99ae" stroke-width="3"/>
          <!-- 链条 -->
          <path d="M 350 415 L 490 405 A 24 24 0 0 1 490 445 L 350 435 Z"
                fill="none" stroke="#6c757d" stroke-width="3" stroke-dasharray="6 3"/>
        </g>

        <!-- ==============================
             主角：大嘴鹈鹕 (躯干与头部)
             上下颠簸微颤动画 (anim-body)
        ============================== -->
        <g class="anim-body" id="pelicanRider">

          <!-- 尾羽 (带迎风摆动动画) -->
          <g class="anim-tail" id="pelicanTail">
            <path d="M 405 290 C 370 285, 345 300, 360 315 C 375 320, 415 315, 420 305 Z"
                  fill="#cdd7de" stroke="#b0bec5" stroke-width="2"/>
            <path d="M 395 295 C 365 295, 350 310, 370 322 Z"
                  fill="#78909c"/>
          </g>

          <!-- 饱满的鹈鹕身体 -->

          <!-- 漂亮的胸腹羽毛层次 -->
          <path d="M 445 290 Q 455 330 485 335 Q 498 310 490 270 Z" fill="#ffffff" opacity="0.8"/>

          <!-- 头部与巨大喉囊组 -->

              <path d="M 565 186 Q 590 220 625 198"/>
              <path d="M 585 187 Q 605 225 645 197"/>
              <path d="M 552 185 Q 575 210 600 195"/>

            <!-- 坚硬狭长、带倒钩的上喙 (鸟嘴上部) -->
            <path d="M 528 170 L 675 185 C 682 186, 684 192, 678 195 L 540 186 Z"
                  fill="url(#beakTopGrad)" stroke="#b7094c" stroke-width="1.5"/>
            <!-- 嘴尖倒钩特写 -->
            <path d="M 675 185 Q 683 189 678 196" fill="none" stroke="#720026" stroke-width="2"/>
            <!-- 鼻孔线 -->
            <line x1="550" y1="174" x2="570" y2="176" stroke="#9d0208" stroke-width="1.5" stroke-linecap="round"/>

            <!-- 呆萌灵动的眼睛 (带眨眼动画) -->
            <g class="anim-eye" id="pelicanEye">
              <circle cx="538" cy="165" r="7" fill="#ffffff" stroke="#c5d1d9" stroke-width="1"/>
              <circle cx="540" cy="165" r="4" fill="#1d3557"/>
              <!-- 眼神光高光点 -->
              <circle cx="542" cy="163" r="1.5" fill="#ffffff"/>
            </g>

            <!-- 帅气的骑行遮阳帽 (反戴棒球帽) -->
            <g id="cyclingCap" transform="translate(533, 155) rotate(-15)">
              <path d="M -16 5 C -15 -10, 16 -10, 18 5 Z" fill="#e63946"/>
              <!-- 帽檐 (朝后翘起，动感十足) -->
              <path d="M -15 3 Q -32 -2 -28 9 Q -18 7 -15 3 Z" fill="#1d3557"/>
              <!-- 顶部小纽扣 -->
              <circle cx="0" cy="-7" r="3" fill="#ffb703"/>
            </g>
          </g>

          <!-- 帅气飘逸的红色波点围巾 (迎风烈烈飘扬) -->
          <g id="scarfGroup">
            <!-- 脖圈处 -->
            <path d="M 488 238 C 500 230, 520 232, 515 248 C 502 254, 485 248, 488 238 Z"
                  fill="#e63946" stroke="#b7094c" stroke-width="1.5"/>
            <!-- 随风向后飞扬的围巾飘带 -->
            <path class="anim-scarf"
                  d="M 490 242 Q 430 230 405 240 Q 425 258 488 250 Z"
                  fill="#e63946" stroke="#9d0208" stroke-width="1.5"/>
            <!-- 围巾流苏波点 -->
            <circle cx="435" cy="242" r="3" fill="#fff" opacity="0.9"/>
            <circle cx="460" cy="245" r="3.5" fill="#fff" opacity="0.9"/>
          </g>

          <!-- 鹈鹕翅膀（宛如手臂握持车把） -->
          <g id="pelicanWingArm">
            <!-- 翅膀根部与羽毛层次 -->
            <path d="M 450 270 C 475 270, 515 285, 530 310 C 500 325, 450 315, 440 290 Z"
                  fill="#e9ecef" stroke="#b0bec5" stroke-width="1.5"/>
            <path d="M 455 295 C 485 305, 520 312, 530 325 C 495 330, 460 320, 455 295 Z"
                  fill="#78909c"/>
            <!-- 延伸至车把的翅尖（宛如手紧紧握着握把 630, 260） -->
            <path d="M 515 295 Q 575 270 632 258 Q 630 268 595 285 Q 550 310 515 295 Z"
                  fill="#ffffff" stroke="#c5d1d9" stroke-width="1.5"/>
            <!-- 握住车把的翼端羽毛指节 -->
            <ellipse cx="632" cy="260" rx="6" ry="4" fill="#f8f9fa" stroke="#455a64" stroke-width="1"/>
          </g>

        </g> <!-- end anim-body -->

        <!-- 前脚/右腿（在车架外侧：主视觉腿） -->
        <g id="rightLegGroup">
          <!-- 大腿骨 -->
          <line id="rightThigh" x1="475" y1="330" x2="495" y2="390" stroke="#ff9e00" stroke-width="13" stroke-linecap="round"/>
          <!-- 小腿骨 -->
          <line id="rightCalf" x1="495" y1="390" x2="520" y2="445" stroke="#f48c06" stroke-width="11" stroke-linecap="round"/>
          <!-- 关节高光 -->
          <circle id="rightKnee" cx="495" cy="390" r="6" fill="#e85d04"/>
          <!-- 橙黄色大脚蹼（踏在右脚踏板上） -->
          <polygon id="rightFoot" points="505,452 545,452 530,440" fill="#dc2f02"/>
        </g>

        <!-- 曲柄与脚踏板系统 (位于 490, 425) -->
        <g id="cranksetAssembly">
          <!-- 右曲柄组 (与右脚联动) -->
          <line id="crankArmRight" x1="490" y1="425" x2="520" y2="445" stroke="#343a40" stroke-width="7" stroke-linecap="round"/>
          <!-- 右脚踏板 (水平防滑踏板) -->
          <rect id="pedalRight" x="508" y="442" width="24" height="6" rx="2" fill="#212529" stroke="#f8f9fa" stroke-width="1"/>

          <!-- 牙盘中轴螺栓盖 -->
          <circle cx="490" cy="425" r="7" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
        </g>

        <!-- 车轮扬起的气流小尘埃 -->
        <g opacity="0.6">
          <circle cx="310" cy="485" r="4" fill="#e9d8a6">
            <animate attributeName="cx" values="330;270;230" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="485;475;482" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0.4;0" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="r" values="3;6;9" dur="0.8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="320" cy="480" r="3" fill="#e9d8a6">
            <animate attributeName="cx" values="320;250;200" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="480;468;475" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.7;0.3;0" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="r" values="2;5;8" dur="1.1s" repeatCount="indefinite"/>
          </circle>
        </g>

      </g> <!-- end cyclistAndBike -->
    </svg>
  </div>

  <!-- 底部操控条 -->
  <div class="controls-panel">
    <button class="btn" id="playPauseBtn" onclick="togglePlay()">
      <span id="playIcon">⏸</span>
      <span id="playText">暂停</span>
    </button>

    <div class="speed-control">
      <span>速度</span>
      <input type="range" id="speedSlider" min="0.3" max="2.4" step="0.1" value="1.0" oninput="setSpeed(this.value)">
      <span id="speedValText">1.0x</span>
    </div>

    <button class="btn secondary" onclick="ringBell()">
      🔔 按车铃
    </button>

    <button class="btn secondary" onclick="toggleTheme()">
      🎨 切换时间: <span id="themeText">白昼</span>
    </button>

    <button class="btn secondary" onclick="squawk()">
      📢 鹈鹕叫声
    </button>
  </div>

  <script>
    /* ==============================================================
       双关节逆运动学 (IK) 引擎：实现 100% 贴合脚踏板的逼真踩踏动作
    ============================================================== */
    const CRANK_CENTER = { x: 490, y: 425 };
    const CRANK_RADIUS = 30; // 曲柄回转半径

    // 左右髋关节固连在鹈鹕身体上 (随身体颠簸)
    const HIP_RIGHT_BASE = { x: 472, y: 330 };
    const HIP_LEFT_BASE  = { x: 452, y: 318 };

    // 左右腿的大腿与小腿骨骼长度
    const THIGH_LEN = 68;
    const CALF_LEN  = 68;

    let crankAngle = 0; // 曲柄当前弧度角
    let speedMultiplier = 1.0;
    let isPlaying = true;
    let currentThemeIdx = 0;
    const themes = ['day', 'sunset', 'night'];
    const themeNames = ['白昼', '黄昏', '黑夜'];

    // DOM 元素引用
    const rightThigh = document.getElementById('rightThigh');
    const rightCalf  = document.getElementById('rightCalf');
    const rightKnee  = document.getElementById('rightKnee');
    const rightFoot  = document.getElementById('rightFoot');
    const crankRight = document.getElementById('crankArmRight');
    const pedalRight = document.getElementById('pedalRight');

    const leftThigh  = document.getElementById('leftThigh');
    const leftCalf   = document.getElementById('leftCalf');
    const leftFoot   = document.getElementById('leftFoot');

    const sceneCard  = document.getElementById('sceneCard');
    const speedSlider = document.getElementById('speedSlider');
    const speedValText = document.getElementById('speedValText');
    const speedDisplay = document.getElementById('speedDisplay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon     = document.getElementById('playIcon');
    const playText     = document.getElementById('playText');
    const bikeBell     = document.getElementById('bikeBell');
    const themeText    = document.getElementById('themeText');

    /**
     * 2D 骨骼逆运动学解析求解器
     * 计算髋关节 hip 到脚踝 pedal 之间的膝盖坐标
     */
    function solveIK(hip, target, l1, l2, flipKnee = false) {
      const dx = target.x - hip.x;
      const dy = target.y - hip.y;
      const dist = Math.hypot(dx, dy);

      // 防止脚踏距离过长导致肢体拉断，做限位保护
      const clampedDist = Math.min(dist, l1 + l2 - 0.001);

      // 三角形余弦定理求内角
      const cosAngle = (l1 * l1 + clampedDist * clampedDist - l2 * l2) / (2 * l1 * clampedDist);
      const angleBetween = Math.acos(Math.max(-1, Math.min(1, cosAngle)));
      const baseAngle = Math.atan2(dy, dx);

      // 膝盖向前方凸出 (自行车骑行动作)
      const kneeAngle = flipKnee ? (baseAngle + angleBetween) : (baseAngle - angleBetween);

      return {
        x: hip.x + l1 * Math.cos(kneeAngle),
        y: hip.y + l1 * Math.sin(kneeAngle)
      };
    }

    /**
     * 主动画循环：高精驱动双腿踩踏与机械曲柄同步旋转
     */
    let lastTime = performance.now();

    function renderLoop(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (isPlaying) {
        // 随着骑行速度更新曲柄旋转角
        crankAngle += delta * 4.8 * speedMultiplier;
        if (crankAngle > Math.PI * 2) crankAngle -= Math.PI * 2;

        // 获取身体颠簸微小偏移 (通过正弦函数同频模拟)
        const bobOffset = Math.sin(crankAngle * 2) * 3.5;

        // ---------- 1. 右腿动力学求解 ----------
        const hipR = { x: HIP_RIGHT_BASE.x, y: HIP_RIGHT_BASE.y + bobOffset };
        const pedalR = {
          x: CRANK_CENTER.x + Math.cos(crankAngle) * CRANK_RADIUS,
          y: CRANK_CENTER.y + Math.sin(crankAngle) * CRANK_RADIUS
        };

        const kneeR = solveIK(hipR, pedalR, THIGH_LEN, CALF_LEN, false);

        // 更新右腿大腿骨、小腿骨、膝关节
        rightThigh.setAttribute('x1', hipR.x);
        rightThigh.setAttribute('y1', hipR.y);
        rightThigh.setAttribute('x2', kneeR.x);
        rightThigh.setAttribute('y2', kneeR.y);

        rightCalf.setAttribute('x1', kneeR.x);
        rightCalf.setAttribute('y1', kneeR.y);
        rightCalf.setAttribute('x2', pedalR.x);
        rightCalf.setAttribute('y2', pedalR.y);

        rightKnee.setAttribute('cx', kneeR.x);
        rightKnee.setAttribute('cy', kneeR.y);

        // 脚蹼保持在脚踏上方水平微调
        rightFoot.setAttribute('points', `
          ${pedalR.x - 12},${pedalR.y + 4}
          ${pedalR.x + 28},${pedalR.y + 4}
          ${pedalR.x + 12},${pedalR.y - 7}
        `);

        // 曲柄连杆与脚踏板
        crankRight.setAttribute('x2', pedalR.x);
        crankRight.setAttribute('y2', pedalR.y);
        pedalRight.setAttribute('x', pedalR.x - 12);
        pedalRight.setAttribute('y', pedalR.y - 3);

        // ---------- 2. 左腿动力学求解 (相位差 180 度) ----------
        const hipL = { x: HIP_LEFT_BASE.x, y: HIP_LEFT_BASE.y + bobOffset };
        const pedalL = {
          x: CRANK_CENTER.x + Math.cos(crankAngle + Math.PI) * CRANK_RADIUS,
          y: CRANK_CENTER.y + Math.sin(crankAngle + Math.PI) * CRANK_RADIUS
        };

        const kneeL = solveIK(hipL, pedalL, THIGH_LEN, CALF_LEN, false);

        leftThigh.setAttribute('x1', hipL.x);
        leftThigh.setAttribute('y1', hipL.y);
        leftThigh.setAttribute('x2', kneeL.x);
        leftThigh.setAttribute('y2', kneeL.y);

        leftCalf.setAttribute('x1', kneeL.x);
        leftCalf.setAttribute('y1', kneeL.y);
        leftCalf.setAttribute('x2', pedalL.x);
        leftCalf.setAttribute('y2', pedalL.y);

        leftFoot.setAttribute('points', `
          ${pedalL.x - 10},${pedalL.y + 4}
          ${pedalL.x + 26},${pedalL.y + 4}
          ${pedalL.x + 10},${pedalL.y - 7}
        `);
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);

    /* ==============================================================
       交互控制器：调速、暂停、切换场景、播放音效
    ============================================================== */
    function setSpeed(val) {
      speedMultiplier = parseFloat(val);
      speedValText.innerText = speedMultiplier.toFixed(1) + 'x';

      let stateText = '慢速巡航';
      if (speedMultiplier >= 1.8) stateText = '疯狂冲刺 💨';
      else if (speedMultiplier >= 1.2) stateText = '快速前进';
      else if (speedMultiplier >= 0.8) stateText = '正常骑行';

      speedDisplay.innerText = `骑行巡航速度: ${stateText} (${speedMultiplier.toFixed(1)}x)`;

      // 动态调整所有纯 CSS 动画的播放速率
      const svg = document.getElementById('pelicanSvg');
      const animElements = svg.querySelectorAll('[class*="anim-"]');
      animElements.forEach(el => {
        el.style.animationDuration = '';
      });

      // 调整全局动画时间比率
      const baseSpeeds = {
        'anim-road': 1.2,
        'anim-wheel-r': 1.2,
        'anim-wheel-f': 1.2,
        'anim-body': 0.6,
        'anim-beak': 0.6,
        'anim-scarf': 0.35,
        'anim-fish': 0.6,
        'anim-tail': 0.6,
        'anim-hills': 14,
        'anim-cloud-near': 26,
        'anim-cloud-far': 45
      };

      for (let [cls, baseDur] of Object.entries(baseSpeeds)) {
        const elems = document.getElementsByClassName(cls);
        for (let el of elems) {
          el.style.animationDuration = (baseDur / speedMultiplier) + 's';
        }
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        sceneCard.classList.remove('paused');
        playIcon.innerText = '⏸';
        playText.innerText = '暂停';
      } else {
        sceneCard.classList.add('paused');
        playIcon.innerText = '▶';
        playText.innerText = '继续';
      }
    }

    function toggleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      sceneCard.className = 'canvas-card ' + (themes[currentThemeIdx] === 'day' ? '' : themes[currentThemeIdx]);
      themeText.innerText = themeNames[currentThemeIdx];

      // 白天与黑夜的星空/太阳变化
      const celestial = document.getElementById('celestialBody');
      if (themes[currentThemeIdx] === 'night') {
        celestial.innerHTML = `
          <circle cx="0" cy="0" r="30" fill="#e0e1dd" filter="url(#softGlow)"/>
          <circle cx="8" cy="-5" r="26" fill="#1b263b"/>
        `;
      } else if (themes[currentThemeIdx] === 'sunset') {
        celestial.innerHTML = `
          <circle cx="0" cy="0" r="70" fill="url(#sunGlow)"/>
          <circle cx="0" cy="0" r="42" fill="#ff7b00"/>
        `;
      } else {
        celestial.innerHTML = `
          <circle cx="0" cy="0" r="70" fill="url(#sunGlow)"/>
          <circle cx="0" cy="0" r="38" fill="#fff7d6"/>
        `;
      }
    }

    /* 使用 Web Audio API 合成可爱的车铃声与叫声（无需外部音频文件） */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function ringBell() {
      initAudio();
      bikeBell.classList.remove('is-ringing');
      void bikeBell.offsetWidth; // 触发重绘
      bikeBell.classList.add('is-ringing');

      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // 叮叮双音调高音脆铃
      [2400, 3100].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.1);

        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.1);
        osc.stop(now + idx * 0.1 + 0.5);
      });
    }

    function squawk() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // 模拟鹈鹕低沉憨厚的“嘎~嘎~”叫声
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';

      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.36);

      // 嘴巴剧烈张合互动
      const pouch = document.getElementById('gularPouch');
      pouch.style.transform = 'scale(1.15, 1.25) rotate(-3deg)';
      setTimeout(() => {
        pouch.style.transform = '';
      }, 350);
    }

    // 默认应用 1.0x 速度配置
    setSpeed(1.0);
  </script>
